name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Verificar Java
        run: |
          java -version
          javac -version


      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true


      - name: Verificar AIDL
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Procurando AIDL..."
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print
          echo "Versão do AIDL:"
          "$ANDROID_HOME/build-tools/34.0.0/aidl" --version


      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3"
          pip install buildozer


      - name: Criar buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'

          [app]

          title = Carta Samantha

          package.name = cartasamantha

          package.domain = org.samantha

          source.dir = .

          source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json

          version = 1.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 34

          android.minapi = 21

          android.ndk = 27c

          android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO

          android.sdk_path = /usr/local/lib/android/sdk

          android.ndk_path = /usr/local/lib/android/sdk/ndk/27.3.13750724


          [buildozer]

          log_level = 2

          warn_on_root = 1

          EOF


      - name: Limpar builds anteriores
        run: |
          rm -rf .buildozer
          rm -rf bin


      - name: Gerar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          buildozer -v android debug


      - name: Verificar APK
        run: |
          echo "Arquivos APK encontrados:"
          ls -lh bin/


      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: carta-samantha-apk
          path: bin/*.apk
