name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK (moderno)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platforms: 'android-34'

      - name: Baixar e instalar NDK r28c manualmente
        run: |
          NDK_VERSION="r28c"
          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          NDK_DIR="$HOME/android-ndk-${NDK_VERSION}"
          mkdir -p "$NDK_DIR"
          curl -L "$NDK_URL" -o ndk.zip
          unzip -q ndk.zip -d "$HOME"
          rm ndk.zip
          # O diretório extraído é android-ndk-r28c
          echo "NDK installed at $HOME/android-ndk-r28c"
          echo "NDK_PATH=$HOME/android-ndk-r28c" >> $GITHUB_ENV

      - name: Verificar SDK e AIDL
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          if [ -f "$BUILD_TOOLS/aidl" ]; then
            echo "AIDL encontrado em $BUILD_TOOLS/aidl"
          else
            echo "ERRO: AIDL não encontrado"
            ls -la "$ANDROID_SDK_ROOT/build-tools/"
            exit 1
          fi
          # Adiciona cmdline-tools ao PATH para o Buildozer encontrar o sdkmanager moderno
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Instalar Cython e Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython
          pip install buildozer==1.5.0

      - name: Criar/ajustar buildozer.spec com SDK e NDK fixos
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          # Remove definições antigas
          sed -i '/^android.sdk_path/d' buildozer.spec
          sed -i '/^android.ndk_path/d' buildozer.spec
          sed -i '/^android.allow_sdk_update/d' buildozer.spec
          sed -i '/^android.allow_ndk_update/d' buildozer.spec
          # Adiciona as configurações corretas
          echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec
          echo "android.ndk_path = $HOME/android-ndk-r28c" >> buildozer.spec
          echo "android.allow_sdk_update = False" >> buildozer.spec
          echo "android.allow_ndk_update = False" >> buildozer.spec
          # Exibe para verificação
          grep -E "(android.sdk_path|android.ndk_path|android.allow)" buildozer.spec

      - name: Compilar APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_PATH: ${{ env.NDK_PATH }}
        run: |
          # Garantia extra: coloca o sdkmanager moderno no PATH
          export PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH
          buildozer -v android debug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaSamantha-APK
          path: bin/*.apk
