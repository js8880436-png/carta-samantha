name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platforms: 'android-34'

      - name: Criar link simbólico para o SDK no local esperado pelo Buildozer
        run: |
          # O SDK real está em /usr/local/lib/android/sdk
          REAL_SDK="/usr/local/lib/android/sdk"
          # O local onde o Buildozer procura
          BUILD_OZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          # Cria o diretório pai, se não existir
          mkdir -p "$(dirname "$BUILD_OZER_SDK")"
          # Remove qualquer link ou diretório existente (se houver)
          rm -rf "$BUILD_OZER_SDK"
          # Cria o link simbólico
          ln -s "$REAL_SDK" "$BUILD_OZER_SDK"
          # Verifica se o AIDL está acessível pelo link
          if [ -f "$BUILD_OZER_SDK/build-tools/34.0.0/aidl" ]; then
            echo "AIDL encontrado via link simbólico!"
          else
            echo "ERRO: AIDL não encontrado. Listando conteúdo do SDK:"
            ls -la "$BUILD_OZER_SDK/build-tools/"
            exit 1
          fi

      - name: Instalar Cython e Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython
          pip install buildozer==1.5.0

      - name: Criar/ajustar buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          # Garante que o android.sdk_path esteja vazio para forçar o Buildozer a usar o padrão (que agora aponta para o real via link)
          sed -i 's/^android.sdk_path.*/android.sdk_path = /' buildozer.spec || echo "android.sdk_path = " >> buildozer.spec
          # Também define ANDROID_HOME e ANDROID_SDK_ROOT para garantir
          grep -q "android.sdk_path" buildozer.spec || echo "android.sdk_path = " >> buildozer.spec

      - name: Compilar APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          buildozer -v android debug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaSamantha-APK
          path: bin/*.apk
