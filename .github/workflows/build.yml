name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Criar buildozer.spec
        run: |
          buildozer init

      - name: Configurar Buildozer
        run: |
          sed -i 's/^title = .*/title = Carta Samantha/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = cartasamantha/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.samantha/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

      - name: Gerar APK
        run: |
          yes | buildozer -v android debug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: carta-samantha-apk
          path: bin/*.apk
