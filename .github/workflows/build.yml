name: Gerar APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Baixar projeto
uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Configurar Android
    uses: android-actions/setup-android@v3

  - name: Preparar SDK
    shell: bash
    run: |
      set -e
      export JAVA_HOME="${JAVA_HOME_17_X64}"
      export PATH="$JAVA_HOME/bin:$PATH"
      export ANDROID_HOME="/usr/local/lib/android/sdk"
      export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

      sudo rm -rf "$ANDROID_HOME/tools"

      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"

      echo "Java:"
      java -version

      echo "SDK Manager:"
      which sdkmanager
      sdkmanager --version

      yes | sdkmanager --licenses || true

      sdkmanager "platform-tools"
      sdkmanager "platforms;android-34"
      sdkmanager "build-tools;34.0.0"

      echo "AIDL:"
      "$ANDROID_HOME/build-tools/34.0.0/aidl" --version

  - name: Instalar Buildozer
    shell: bash
    run: |
      python -m pip install --upgrade pip setuptools wheel
      pip install "cython<3"
      pip install "buildozer==1.5.0"

  - name: Criar buildozer.spec
    shell: bash
    run: |
      cat > buildozer.spec <<'EOF'
      [app]
      title = Carta Samantha
      package.name = cartasamantha
      package.domain = org.samantha
      source.dir = .
      source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json
      version = 1.0
      requirements = python3,kivy
      orientation = portrait
      fullscreen = 0
      android.api = 34
      android.minapi = 21
      android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO

      [buildozer]
      log_level = 2
      warn_on_root = 1
      EOF

  - name: Limpar Buildozer
    shell: bash
    run: |
      rm -rf .buildozer
      rm -rf bin

  - name: Gerar APK
    shell: bash
    env:
      JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    run: |
      set -o pipefail
      export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
      buildozer -v android debug 2>&1 | tee build.log

  - name: Mostrar erro
    if: failure()
    shell: bash
    run: |
      if [ -f build.log ]; then
        tail -n 250 build.log
      fi

  - name: Verificar APK
    if: success()
    shell: bash
    run: |
      ls -lh bin/

  - name: Enviar APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Carta-Samantha-APK
      path: bin/*.apk
      if-no-files-found: error
