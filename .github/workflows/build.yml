name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platforms: 'android-34'

      - name: Verificar SDK e AIDL
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          if [ -f "$BUILD_TOOLS/aidl" ]; then
            echo "AIDL encontrado em $BUILD_TOOLS/aidl"
          else
            echo "ERRO: AIDL não encontrado"
            ls -la "$ANDROID_SDK_ROOT/build-tools/"
            exit 1
          fi

      - name: Instalar Cython e Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython
          pip install buildozer==1.5.0

      - name: Criar/ajustar buildozer.spec com SDK correto
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          # Substitui ou adiciona a linha android.sdk_path
          if grep -q "^android.sdk_path" buildozer.spec; then
            sed -i 's|^android.sdk_path.*|android.sdk_path = /usr/local/lib/android/sdk|' buildozer.spec
          else
            echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec
          fi
          # Verifica se ficou configurado
          grep android.sdk_path buildozer.spec

      - name: Compilar APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          buildozer -v android debug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaSamantha-APK
          path: bin/*.apk
