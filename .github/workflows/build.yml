name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Verificar AIDL
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print
          "$ANDROID_HOME/build-tools/34.0.0/aidl" --version

      - name: Instalar Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3"
          pip install buildozer

      - name: Criar buildozer.spec
        shell: bash
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Carta Samantha
          package.name = cartasamantha
          package.domain = org.samantha
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json
          version = 1.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.api = 34
          android.minapi = 21
          android.ndk = 27c
          android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO
          android.sdk_path = /usr/local/lib/android/sdk
          android.ndk_path = /usr/local/lib/android/sdk/ndk/27.3.13750724

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Limpar
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Gerar APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          buildozer -v android debug

      - name: Verificar APK
        shell: bash
        run: |
          ls -lh bin/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: carta-samantha-apk
          path: bin/*.apk
