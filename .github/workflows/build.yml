name: Gerar APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04

steps:

  - name: Baixar projeto
    uses: actions/checkout@v4

  - name: Configurar Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Configurar Android SDK
    uses: android-actions/setup-android@v3

  - name: Preparar Android SDK
    shell: bash
    run: |
      set -e

      export JAVA_HOME="${JAVA_HOME_17_X64}"
      export PATH="$JAVA_HOME/bin:$PATH"

      echo "JAVA:"
      java -version

      echo "ANDROID_HOME=$ANDROID_HOME"

      # Remover ferramentas Android antigas que fazem o Buildozer
      # chamar o sdkmanager incompatível com Java 17.
      sudo rm -rf "$ANDROID_HOME/tools"

      # Garantir que o sdkmanager moderno seja o primeiro encontrado.
      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"

      echo "SDKMANAGER:"
      which sdkmanager
      sdkmanager --version

      echo "Instalando componentes Android..."

      yes | sdkmanager --licenses >/dev/null || true

      sdkmanager \
        "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0"

      echo "Verificando AIDL..."

      test -f "$ANDROID_HOME/build-tools/34.0.0/aidl"

      "$ANDROID_HOME/build-tools/34.0.0/aidl" --version

      echo "AIDL OK"

  - name: Instalar dependências Python
    shell: bash
    run: |
      python -m pip install --upgrade pip setuptools wheel
      pip install "cython<3"
      pip install "buildozer==1.5.0"

  - name: Criar buildozer.spec
    shell: bash
    run: |
      cat > buildozer.spec <<'EOF'
      [app]

      title = Carta Samantha
      package.name = cartasamantha
      package.domain = org.samantha

      source.dir = .
      source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json

      version = 1.0

      requirements = python3,kivy

      orientation = portrait
      fullscreen = 0

      android.api = 34
      android.minapi = 21

      android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO

      [buildozer]

      log_level = 2
      warn_on_root = 1
      EOF

  - name: Limpar builds anteriores
    shell: bash
    run: |
      rm -rf .buildozer
      rm -rf bin

  - name: Preparar ambiente do Buildozer
    shell: bash
    run: |
      set -e

      export JAVA_HOME="${JAVA_HOME_17_X64}"
      export PATH="$JAVA_HOME/bin:$PATH"

      export ANDROID_HOME="/usr/local/lib/android/sdk"
      export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"

      # Muito importante:
      # impedir que o Buildozer encontre o sdkmanager antigo.
      sudo rm -rf "$ANDROID_HOME/tools"

      export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"

      echo "JAVA:"
      java -version

      echo "SDKMANAGER:"
      which sdkmanager
      sdkmanager --version

      echo "AIDL:"
      "$ANDROID_HOME/build-tools/34.0.0/aidl" --version

  - name: Gerar APK
    shell: bash
    env:
      JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    run: |
      set -o pipefail

      export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"

      buildozer -v android debug 2>&1 | tee build.log

  - name: Mostrar log se falhar
    if: failure()
    shell: bash
    run: |
      echo "=============================="
      echo "LOG DO BUILD"
      echo "=============================="

      if [ -f build.log ]; then
        tail -n 250 build.log
      fi

  - name: Verificar APK
    if: success()
    shell: bash
    run: |
      echo "=============================="
      echo "APK GERADO"
      echo "=============================="

      ls -lh bin/

  - name: Enviar APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Carta-Samantha-APK
      path: bin/*.apk
      if-no-files-found: error
