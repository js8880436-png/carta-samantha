name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==================================================
      # BAIXAR O PROJETO
      # ==================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ==================================================
      # JAVA 17
      # ==================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Ativar Java 17
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          echo "Java utilizado:"
          "$JAVA_HOME_17_X64/bin/java" -version


      # ==================================================
      # PYTHON 3.11
      # ==================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==================================================
      # ANDROID SDK
      # ==================================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      # ==================================================
      # INSTALAR COMPONENTES ANDROID
      # ==================================================

      - name: Instalar componentes Android
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "Java:"
          java -version

          echo "Instalando SDK..."

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

          yes | sdkmanager --licenses || true

          echo "Android SDK pronto."


      # ==================================================
      # INSTALAR BUILDOZER
      # ==================================================

      - name: Instalar Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3"
          pip install buildozer


      # ==================================================
      # CRIAR BUILDOZER.SPEC
      # ==================================================

      - name: Criar buildozer.spec
        shell: bash
        run: |

          cat > buildozer.spec <<'EOF'

          [app]

          title = Carta Samantha

          package.name = cartasamantha

          package.domain = org.samantha

          source.dir = .

          source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json

          version = 1.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 34

          android.minapi = 21

          android.ndk = 27c

          android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO

          android.sdk_path = /usr/local/lib/android/sdk

          android.ndk_path = /usr/local/lib/android/sdk/ndk/27.3.13750724


          [buildozer]

          log_level = 2

          warn_on_root = 1

          EOF


      # ==================================================
      # LIMPAR BUILDS ANTERIORES
      # ==================================================

      - name: Limpar builds anteriores
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ==================================================
      # GERAR APK
      # ==================================================

      - name: Gerar APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |

          export PATH="$JAVA_HOME/bin:$PATH"

          echo "========================================"
          echo "AMBIENTE"
          echo "========================================"

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          java -version

          echo "========================================"
          echo "ANDROID_HOME"
          echo "========================================"

          echo "$ANDROID_HOME"

          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "ERRO NO BUILDOZER"
            echo "========================================"
            echo ""

            tail -n 100 build.log

            exit "$RESULT"
          fi


      # ==================================================
      # CONFERIR APK
      # ==================================================

      - name: Conferir APK
        if: success()
        shell: bash
        run: |

          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          ls -lh bin/


      # ==================================================
      # DISPONIBILIZAR APK PARA DOWNLOAD
      # ==================================================

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Carta-Samantha-APK
          path: bin/*.apk
          if-no-files-found: error
