name: Build Android APK

on:
  workflow_dispatch:  # Acionamento manual

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK (moderno)
        uses: android-actions/setup-android@v3
        with:
          # Instala as ferramentas e plataformas necessárias
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platforms: 'android-34'

      - name: Verificar SDK e AIDL
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT/build-tools/34.0.0/aidl || echo "AIDL não encontrado"
          # Garante que o sdkmanager moderno está no PATH
          which sdkmanager || echo "sdkmanager não está no PATH"
          # Se não estiver, adiciona manualmente
          if ! which sdkmanager; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0

      - name: Gerar buildozer.spec (se não existir)
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

      - name: Compilar APK com Buildozer
        env:
          # Força o uso do SDK e NDK baixados pelo Buildozer (não interfere)
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          # Permite que o Buildozer baixe seu próprio NDK (recomendado)
        run: |
          buildozer -v android debug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaSamantha-APK
          path: bin/*.apk
