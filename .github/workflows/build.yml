name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =====================================================
      # BAIXAR PROJETO
      # =====================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # JAVA 8
      # =====================================================

      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"


      # =====================================================
      # VERIFICAR JAVA
      # =====================================================

      - name: Verificar Java
        shell: bash
        run: |
          java -version
          javac -version


      # =====================================================
      # ANDROID SDK
      # =====================================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      # =====================================================
      # ANDROID SDK E BUILD TOOLS
      # =====================================================

      - name: Instalar Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true


      # =====================================================
      # VERIFICAR AIDL
      # =====================================================

      - name: Verificar AIDL
        shell: bash
        run: |
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo "BUILD TOOLS:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "AIDL:"
          find "$ANDROID_HOME/build-tools" -name aidl -type f -print


      # =====================================================
      # INSTALAR BUILDZER
      # =====================================================

      - name: Instalar Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "cython<3"
          pip install buildozer


      # =====================================================
      # CRIAR BUILDOZER.SPEC
      # =====================================================

      - name: Criar buildozer.spec
        shell: bash
        run: |

          cat > buildozer.spec <<'EOF'

          [app]

          title = Carta Samantha

          package.name = cartasamantha

          package.domain = org.samantha

          source.dir = .

          source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json

          version = 1.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 34

          android.minapi = 21

          android.ndk = 27c

          android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO

          android.sdk_path = /usr/local/lib/android/sdk

          android.ndk_path = /usr/local/lib/android/sdk/ndk/27.3.13750724


          [buildozer]

          log_level = 2

          warn_on_root = 1

          EOF


      # =====================================================
      # LIMPAR BUILDS ANTERIORES
      # =====================================================

      - name: Limpar builds anteriores
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin


      # =====================================================
      # GERAR APK
      # =====================================================

      - name: Gerar APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: /usr/lib/jvm/temurin-8-jdk-amd64
        run: |

          export PATH="$JAVA_HOME/bin:$PATH"

          echo "Java usado pelo Buildozer:"
          java -version

          echo "Iniciando Buildozer..."

          buildozer -v android debug


      # =====================================================
      # VERIFICAR APK
      # =====================================================

      - name: Verificar APK
        shell: bash
        run: |

          echo "===================================="
          echo "ARQUIVOS GERADOS"
          echo "===================================="

          ls -lh bin/


            # =====================================================
      # ENVIAR APK PARA O GITHUB
      # =====================================================

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: carta-samantha-apk
          path: bin/*.apk
