name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ==================================================
      # JAVA 17
      # ==================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Configurar JAVA_HOME
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version
          javac -version


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==================================================
      # ANDROID SDK
      # ==================================================

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3


      - name: Instalar Android
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"

          yes | sdkmanager --licenses || true


      # ==================================================
      # BUILDOZER
      # ==================================================

      - name: Instalar Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install "cython<3"

          pip install "buildozer==1.5.0"


      # ==================================================
      # BUILDOZER SPEC
      # ==================================================

      - name: Criar buildozer.spec
        shell: bash
        run: |

          cat > buildozer.spec <<'EOF'

          [app]

          title = Carta Samantha

          package.name = cartasamantha

          package.domain = org.samantha

          source.dir = .

          source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json

          version = 1.0

          requirements = python3,kivy

          orientation = portrait

          fullscreen = 0

          android.api = 33

          android.minapi = 21

          android.ndk = 25b

          android.permissions = READ_MEDIA_IMAGES,READ_MEDIA_VIDEO

          android.sdk_path = /usr/local/lib/android/sdk


          [buildozer]

          log_level = 2

          warn_on_root = 1

          EOF


      # ==================================================
      # LIMPAR
      # ==================================================

      - name: Limpar builds
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ==================================================
      # GERAR APK
      # ==================================================

      - name: Gerar APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |

          export PATH="$JAVA_HOME/bin:$PATH"

          echo "===================================="
          echo "JAVA"
          echo "===================================="

          java -version

          echo "===================================="
          echo "ANDROID"
          echo "===================================="

          echo "$ANDROID_HOME"

          echo "===================================="
          echo "BUILDOZER"
          echo "===================================="

          buildozer -v android debug 2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo ""
            echo "===================================="
            echo "ULTIMAS LINHAS DO LOG"
            echo "===================================="

            tail -n 150 build.log

            exit "$RESULT"
          fi


      # ==================================================
      # VERIFICAR APK
      # ==================================================

      - name: Verificar APK
        if: success()
        shell: bash
        run: |
          echo "APK:"
          ls -lh bin/


      # ==================================================
      # UPLOAD
      # ==================================================

      - name: Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Carta-Samantha-APK
          path: bin/*.apk
          if-no-files-found: error
