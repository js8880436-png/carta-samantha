name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platforms: 'android-34'

      - name: Adicionar build-tools ao PATH e verificar AIDL
        run: |
          # Define o caminho das build-tools
          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          echo "Build tools directory: $BUILD_TOOLS_DIR"
          # Adiciona ao PATH
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          # Verifica se o AIDL existe
          if [ -f "$BUILD_TOOLS_DIR/aidl" ]; then
            echo "AIDL encontrado em $BUILD_TOOLS_DIR/aidl"
          else
            echo "ERRO: AIDL não encontrado. Listando build-tools:"
            ls -la "$ANDROID_SDK_ROOT/build-tools/"
            exit 1
          fi

      - name: Instalar dependências Python (Cython, Buildozer)
        run: |
          pip install --upgrade pip setuptools
          pip install cython
          pip install buildozer==1.5.0

      - name: Gerar buildozer.spec se não existir
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi

      - name: Compilar APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}  # Força o ANDROID_HOME
        run: |
          buildozer -v android debug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaSamantha-APK
          path: bin/*.apk
