name: Gerar APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Android SDK
    uses: android-actions/setup-android@v3

  - name: Instalar SDK
    run: |
      export JAVA_HOME="${JAVA_HOME_17_X64}"
      export ANDROID_HOME="/usr/local/lib/android/sdk"
      export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
      export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

      sudo rm -rf "$ANDROID_HOME/tools"

      sdkmanager --version
      sdkmanager "platform-tools"
      sdkmanager "platforms;android-34"
      sdkmanager "build-tools;34.0.0"

      "$ANDROID_HOME/build-tools/34.0.0/aidl" --version

  - name: Instalar Buildozer
    run: |
      python -m pip install --upgrade pip setuptools wheel
      pip install "cython<3"
      pip install "buildozer==1.5.0"

  - name: Criar buildozer.spec
    run: |
      cat > buildozer.spec <<'EOF'
      [app]
      title = Carta Samantha
      package.name = cartasamantha
      package.domain = org.samantha
      source.dir = .
      source.include_exts = py,png,jpg,jpeg,webp,kv,atlas,txt,json
      version = 1.0
      requirements = python3,kivy
      orientation = portrait
      fullscreen = 0
      android.api = 34
      android.minapi = 21

      [buildozer]
      log_level = 2
      warn_on_root = 1
      EOF

  - name: Limpar
    run: |
      rm -rf .buildozer
      rm -rf bin

  - name: Gerar APK
    env:
      JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    run: |
      export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
      buildozer -v android debug 2>&1 | tee build.log

  - name: Enviar APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Carta-Samantha-APK
      path: bin/*.apk
