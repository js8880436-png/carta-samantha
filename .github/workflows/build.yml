name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK (moderno)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platforms: 'android-34'

      - name: Criar link simbólico para o SDK no local do Buildozer
        run: |
          REAL_SDK="/usr/local/lib/android/sdk"
          BUILD_OZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          # Remove qualquer diretório/link existente
          rm -rf "$BUILD_OZER_SDK"
          mkdir -p "$(dirname "$BUILD_OZER_SDK")"
          ln -s "$REAL_SDK" "$BUILD_OZER_SDK"
          # Verifica se o AIDL está acessível
          if [ -f "$BUILD_OZER_SDK/build-tools/34.0.0/aidl" ]; then
            echo "AIDL encontrado via link simbólico!"
          else
            echo "ERRO: AIDL não encontrado. Listando build-tools:"
            ls -la "$BUILD_OZER_SDK/build-tools/"
            exit 1
          fi
          # Adiciona os caminhos ao PATH para garantir que o sdkmanager moderno seja usado
          echo "$REAL_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$REAL_SDK/platform-tools" >> $GITHUB_PATH
          echo "$REAL_SDK/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Instalar Cython e Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython
          pip install buildozer==1.5.0

      - name: Criar/ajustar buildozer.spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          # Remove qualquer definição antiga e força o caminho do SDK
          sed -i '/^android.sdk_path/d' buildozer.spec
          echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec
          # Deixa o NDK vazio para o Buildozer baixar (funciona)
          sed -i '/^android.ndk_path/d' buildozer.spec
          echo "android.ndk_path = " >> buildozer.spec
          # Verifica
          grep -E "(android.sdk_path|android.ndk_path)" buildozer.spec

      - name: Compilar APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Garantia extra: força o uso do sdkmanager moderno
          export PATH=/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH
          buildozer -v android debug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaSamantha-APK
          path: bin/*.apk
