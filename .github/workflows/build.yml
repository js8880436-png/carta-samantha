name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platforms: 'android-34'

      - name: Aceitar licenças do SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Baixar NDK r28c
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          curl -L "$NDK_URL" -o ndk.zip
          unzip -q ndk.zip -d "$HOME"
          rm ndk.zip

      - name: Criar links simbólicos
        run: |
          mkdir -p /home/runner/.buildozer/android/platform
          rm -rf /home/runner/.buildozer/android/platform/android-sdk
          ln -s /usr/local/lib/android/sdk /home/runner/.buildozer/android/platform/android-sdk
          rm -rf /home/runner/.buildozer/android/platform/android-ndk-r28c
          ln -s /home/runner/android-ndk-r28c /home/runner/.buildozer/android/platform/android-ndk-r28c
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
                 /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

      - name: Instalar Cython e Buildozer
        run: |
          pip install --upgrade pip setuptools
          pip install cython
          pip install buildozer==1.5.0

      - name: Criar buildozer.spec do zero (com todas as configurações)
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Carta Samantha
          package.name = cartasamantha
          package.domain = org.js8880436
          version = 1.0.0

          # DEPENDÊNCIAS (CRUCIAL!)
          requirements = python3,kivy,android

          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf

          # Permissões Android
          android.permissions = INTERNET, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE
          android.api = 30
          android.target_sdk = 34
          android.allow_backup = True

          # SDK e NDK (usando os links criados)
          android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk
          android.ndk_path = /home/runner/.buildozer/android/platform/android-ndk-r28c
          android.allow_sdk_update = False
          android.allow_ndk_update = False

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

          echo "=== buildozer.spec criado ==="
          cat buildozer.spec

      - name: Compilar APK
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: CartaSamantha-APK
          path: bin/*.apk
